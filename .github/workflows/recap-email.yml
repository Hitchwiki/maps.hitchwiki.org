name: recap-email

# One-shot "Your <year> recap is ready" email (hitch/scripts/send_year_recap_email.py).
# Default = DRY RUN: logs only the aggregate eligible-account count, sends nothing.
# Sending needs the input send=SEND and a date on/after 2026-12-01 (the approved send day);
# anything else falls back to a dry run. Already-sent accounts are skipped by the script
# (user.recap_email_sent_year), so a repeat dispatch never double-sends.
on:
  workflow_dispatch:
    inputs:
      send:
        description: 'Type SEND to really send (only from 2026-12-01). Anything else = dry run.'
        required: false
        default: 'no'

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - name: Run recap script on the server
        uses: appleboy/ssh-action@v1.2.0
        env:
          SEND_INPUT: ${{ github.event.inputs.send }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SEND_INPUT
          script: |
            SEND=0
            if [ "$SEND_INPUT" = "SEND" ] && [ "$(date -u +%Y-%m-%d)" \> "2026-11-30" ]; then SEND=1; fi
            echo "==> send=$SEND (input='$SEND_INPUT', date=$(date -u +%F))"
            docker exec -e RECAP_EMAIL_YEAR=2026 -e RECAP_EMAIL_SEND=$SEND -e RECAP_EMAIL_PREFLIGHT=1 hitchhiking-map \
              flask --app hitch generate send_year_recap_email 2>&1 | grep -v -i "email\b.*@" | tail -20
