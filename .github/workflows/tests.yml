name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Network tests hit live third-party Nostr relays; they are deliberately
      # excluded from the deterministic PR suite (see pytest.ini).
      - name: Run Python tests with coverage
        run: make test-python
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run JavaScript tests with coverage
        run: make test-javascript-coverage
      - name: Save JavaScript coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-coverage
          path: coverage/javascript/summary.txt
          if-no-files-found: error

  coverage-summary:
    if: always() && github.event_name == 'pull_request'
    needs: [python, javascript]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download Python coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: python-coverage
          path: coverage/python
      - name: Download JavaScript coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: javascript-coverage
          path: coverage/javascript
      - name: Generate coverage overview
        run: |
          python scripts/coverage_pr_summary.py \
            --python-status "${{ needs.python.result }}" \
            --javascript-status "${{ needs.javascript.result }}" \
            --python-report coverage/python/coverage.xml \
            --javascript-report coverage/javascript/summary.txt \
            --output coverage/pr-summary.md
          cat coverage/pr-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update pull request coverage comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- hitchwiki-maps-coverage-report -->';
            const body = fs.readFileSync('coverage/pr-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
