<VirtualHost *:80>
    ServerName testhwmap.nomadwiki.org

    # Reverse proxy to Docker container
    ProxyPreserveHost On
    ProxyPass / http://localhost:5000/
    ProxyPassReverse / http://localhost:5000/

    # Optional: Increase timeout if your app is slow
    ProxyTimeout 300

    # Logs
    ErrorLog /var/log/apache2/maps.hitchwiki.org_error.log
    CustomLog /var/log/apache2/maps.hitchwiki.org_access.log combined

</VirtualHost>
