services:
  hitchhiking-map:
    build: .
    container_name: hitchhiking-map
    ports:
      - "4242:4242"
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
      - ./dist:/app/dist
      - ./hitch/static:/app/hitch/static
      - ./hitch/templates:/app/hitch/templates
    environment:
      - FLASK_RUN_PORT=4242
    env_file:
      - .env
    restart: unless-stopped
