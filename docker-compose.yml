services:
  hitchhiking-map:
    build: .
    container_name: hitchhiking-map
    ports:
      - "4242:4242"
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
      - ./dist:/app/dist
      - ./hitch/static:/app/hitch/static
      - ./hitch/templates:/app/hitch/templates
      # The in-container cron jobs run `flask ... generate <script>` with a stripped
      # environment, so they never see the vars Docker injects from `env_file`. Flask
      # loads /app/.env via python-dotenv instead. Without this mount that would be the
      # stale copy baked into the image at build time, so cron and the web app would
      # resolve DATABASE_NAME differently and write to two different databases.
      - ./.env:/app/.env:ro
    environment:
      - FLASK_RUN_PORT=4242
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - default
      - nomadwiki-relay

networks:
  # Shared external network with the nomadwiki nostr relay container running on the same host
  # (see /var/www/relay.nomadwiki.org/docker-compose.yml). Joining this lets us reach the relay
  # via ws://nomadwiki-relay:8080 instead of the public wss://relay.nomadwiki.org URL, which
  # avoids hairpin NAT (Docker drops cross-bridge forwarding to a sibling container's published
  # port). When deploying on a different host, drop this network and point RELAYS in .env at
  # the public wss URL instead.
  nomadwiki-relay:
    name: nomadwiki-relay
    external: true
