{% extends "security/base.html" %}

{% set title = "My rides" %}

{% block content %}
<h1>My rides for {{ current_user.username }}</h1>

{% if is_logged_in %}
  <p>Below are your rides.</p>
  {{ rides|safe }}
{% else %}
  <p>Please <a href="/login">log in</a> to view your rides.</p>
{% endif %}
{% endblock %}
