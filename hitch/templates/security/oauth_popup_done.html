<!doctype html>
<html lang="{{ g.lang }}">
<head>
  <meta charset="utf-8" />
  <title>{{ t("Signed in") }}</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  <p>{{ t("Signed in. You can close this window.") }}</p>
  <script>
    (function () {
      var msg = {
        type: "hitchwiki-auth",
        ok: true,
        needsProfile: {{ needs_profile|tojson }}
      };
      // This page is served from our own origin, so address the opener at that exact
      // origin. A wildcard target would let any window read the message.
      if (window.opener) {
        try { window.opener.postMessage(msg, window.location.origin); } catch (e) {}
      }
      window.close();
      // If the browser refuses to close a window it didn't script-open, the user still
      // needs a way out. A brand-new account goes to the map with the first-run intro
      // flag (welcome.js runs the intro, then the profile-setup form).
      window.setTimeout(function () {
        window.location.href = {{ ("/?welcome=1" if needs_profile else "/me")|tojson }};
      }, 800);
    })();
  </script>
</body>
</html>
